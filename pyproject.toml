[project]
name = "agente-erp"
version = "0.1.0"
description = "Agente que responde perguntas de negócio consultando o banco de um ERP legado, com guardrails e avaliação"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[project.scripts]
agente-erp = "agente_erp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
